apiVersion: apps/v1
kind: Deployment
metadata:
  name: finger-chess-frontend
  namespace: finger-chess
  labels:
    app: finger-chess-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: finger-chess-frontend
  template:
    metadata:
      labels:
        app: finger-chess-frontend
    spec:
      containers:
        - name: finger-chess-frontend
          image: ghcr.io/your-org/finger-chess/finger-chess-frontend:latest
          ports:
            - containerPort: 3001
          resources:
            requests: { cpu: '100m', memory: '128Mi' }
            limits: { cpu: '500m', memory: '256Mi' }
          livenessProbe:
            httpGet: { path: /, port: 3001 }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /, port: 3001 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: finger-chess-frontend
  namespace: finger-chess
spec:
  selector:
    app: finger-chess-frontend
  ports:
    - port: 80
      targetPort: 3001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: finger-chess-frontend-hpa
  namespace: finger-chess
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: finger-chess-frontend }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
