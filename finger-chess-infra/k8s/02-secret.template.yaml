# TEMPLATE ONLY. Never commit this file with real values filled in.
#
# In production, prefer sourcing these from a real secrets manager instead
# of a plain Kubernetes Secret (which is only base64-encoded, not
# encrypted, unless you've enabled encryption-at-rest for etcd and RBAC'd
# who can `kubectl get secret` tightly):
#   - AWS: External Secrets Operator syncing from AWS Secrets Manager
#   - GCP: External Secrets Operator syncing from Secret Manager
#   - Vault: the Vault Agent Injector
#
# Populate for real use with:
#   kubectl create secret generic finger-chess-backend-secrets \
#     --namespace finger-chess \
#     --from-literal=DATABASE_URL='...' \
#     --from-literal=FINGER_CHESS_JWT_ACCESS_SECRET='...' \
#     ...
# rather than applying this file directly.
apiVersion: v1
kind: Secret
metadata:
  name: finger-chess-backend-secrets
  namespace: finger-chess
type: Opaque
stringData:
  # DATABASE_URL is deliberately unprefixed — see configuration.ts's own
  # comment for why (Prisma's own convention, several managed Postgres
  # add-ons auto-inject this exact name).
  DATABASE_URL: 'postgresql://REPLACE:REPLACE@REPLACE-me-managed-postgres-host:5432/finger_chess?schema=public&connection_limit=10&pool_timeout=10'
  FINGER_CHESS_JWT_ACCESS_SECRET: 'REPLACE_ME'
  FINGER_CHESS_JWT_REFRESH_SECRET: 'REPLACE_ME'
  FINGER_CHESS_STRIPE_SECRET_KEY: 'REPLACE_ME'
  FINGER_CHESS_STRIPE_WEBHOOK_SECRET: 'REPLACE_ME'
  FINGER_CHESS_AWS_ACCESS_KEY_ID: 'REPLACE_ME'
  FINGER_CHESS_AWS_SECRET_ACCESS_KEY: 'REPLACE_ME'
  FINGER_CHESS_MAIL_PASSWORD: 'REPLACE_ME'
  FINGER_CHESS_GOOGLE_CLIENT_SECRET: 'REPLACE_ME'
  FINGER_CHESS_DISCORD_CLIENT_SECRET: 'REPLACE_ME'
  # REQUIRED — social messaging refuses to start without it (message content
  # is stored encrypted at rest). Generate with: openssl rand -base64 32.
  # Rotating this key makes previously-sent messages undecryptable.
  FINGER_CHESS_MESSAGE_ENCRYPTION_KEY: 'REPLACE_ME'
